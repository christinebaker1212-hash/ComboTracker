name: Windows build

# Builds the desktop app for Windows whenever the app changes. You can also
# run it from the Actions tab ("Run workflow") or by pushing a tag like v0.2.0. Download the result from the
# run's "Artifacts" section and upload the zip to itch.io.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['app/**', 'icons/**', 'Presets/**', '.github/workflows/windows-build.yml']

permissions:
  contents: write

# A newer push cancels an older build still in progress.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci
      - run: npm test
      - name: Controller decoding tests
        working-directory: app/src-tauri
        run: |
          rustc --edition 2024 --test src/hid_decode.rs -o "$env:RUNNER_TEMP/hid_decode.exe"
          & "$env:RUNNER_TEMP/hid_decode.exe"
      - run: npx tauri build

      - name: Package for itch.io
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/ComboTracker | Out-Null
          Copy-Item src-tauri/target/release/combotracker.exe out/ComboTracker/ComboTracker.exe
          Compress-Archive -Path out/ComboTracker -DestinationPath out/ComboTracker-windows-portable.zip
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: ComboTracker-windows
          path: |
            app/out/ComboTracker-windows-portable.zip
            app/out/*-setup.exe

      # Keeps one GitHub Release, "latest", pointing at the newest build.
      - name: Publish to the "latest" GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $sha = "${{ github.sha }}".Substring(0, 7)
          $notes = "Automatic build of ComboTracker $version from ``$sha`` on ${{ github.ref_name }}.`n`n**ComboTracker-windows-portable.zip**: unzip and run ComboTracker.exe, no install.`n**-setup.exe**: regular installer.`n`nIf Windows shows 'Windows protected your PC', click More info, then Run anyway."
          gh release delete latest --yes --cleanup-tag 2>$null
          $files = @("out/ComboTracker-windows-portable.zip") + (Get-ChildItem out/*-setup.exe).FullName
          gh release create latest @files --title "ComboTracker $version (latest build)" --notes $notes --target ${{ github.sha }} --latest

      # Optional: pushes the portable build to itch.io. Set it up once:
      #   1. Get an API key at https://itch.io/user/settings/api-keys
      #   2. Repo Settings > Secrets and variables > Actions:
      #        secret   BUTLER_API_KEY = the key
      #        variable ITCH_GAME      = your-itch-username/your-game-slug
      - name: Push to itch.io
        if: ${{ vars.ITCH_GAME != '' }}
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          Invoke-WebRequest https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default -OutFile butler.zip
          Expand-Archive butler.zip -DestinationPath butler
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          ./butler/butler.exe push out/ComboTracker "${{ vars.ITCH_GAME }}:windows" --userversion "$version-${{ github.run_number }}"
