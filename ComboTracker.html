<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FG Combo Builder & Manager</title>
    <style>
        :root {
            --bg-color: #0F0F0F;
            --panel-bg: #1E1F20;
            --btn-bg: #2A2A2A;
            --btn-hover: #3A3A3A;
            --highlight: #505050;
            --text-color: #FFFFFF;
            --font-main: "Arial", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            display: flex;
            height: 100dvh; 
            overflow: hidden;
            flex-direction: row; 
        }

        /* --- DESKTOP LAYOUT --- */
        .left-panel {
            width: 380px;
            flex-shrink: 0; 
            padding: 15px;
            background-color: var(--bg-color);
            border-right: 2px solid var(--panel-bg);
            border-top: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .right-panel {
            flex: 1;
            min-width: 0; 
            padding: 15px;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        /* --- MOBILE PORTRAIT (Split Screen Stack) --- */
        @media (max-width: 850px) and (orientation: portrait) {
            body { flex-direction: column-reverse; font-size: 14px; }
            .left-panel {
                width: 100%; flex: 0 0 45dvh; 
                border-right: none; border-top: 2px solid var(--panel-bg);
                padding: 8px; padding-bottom: max(25px, env(safe-area-inset-bottom)); gap: 8px; 
            }
            .right-panel { width: 100%; flex: 1; padding: 8px; }
            .toolbar { flex-wrap: wrap; padding-bottom: 8px !important; margin-bottom: 8px !important; }
            
            /* UI Scaling */
            .section { padding: 6px !important; }
            button { padding: 6px 8px !important; font-size: 12px; }
            .palette-btn { min-height: 32px !important; padding: 2px !important; }
            .palette-btn img { height: 20px !important; }
            .token-img { height: 26px !important; }
            .token-pill { padding: 3px 6px !important; font-size: 11px !important; }
            .canvas-container { min-height: 42px !important; padding: 4px 6px !important; }
            .pin-btn { display: none !important; } 
            .combo-name { width: 65px !important; padding: 4px !important; font-size: 12px; }
            .list-name-input { width: 120px !important; font-size: 12px; padding: 4px !important; }
            .slot-count-input { width: 45px !important; font-size: 12px; padding: 4px !important; }
            .combo-row-child { margin-left: 15px !important; padding-left: 5px !important; }
        }

        /* --- MOBILE LANDSCAPE (Scrolling Stack) --- */
        @media (max-width: 850px) and (orientation: landscape), (max-height: 500px) {
            body { 
                flex-direction: column-reverse; 
                height: auto; 
                overflow-y: auto; 
                font-size: 14px;
            }
            .left-panel { 
                width: 100%; 
                border-right: none; 
                border-top: 2px solid var(--panel-bg); 
                height: auto;
                overflow: visible;
                padding: 10px;
                padding-bottom: max(25px, env(safe-area-inset-bottom));
            }
            .right-panel { 
                width: 100%; 
                height: auto;
                min-height: 80dvh; 
                overflow: visible;
                padding: 10px;
            }
            .toolbar { flex-wrap: wrap; }
            .combo-list { overflow: visible; }
            .pin-btn { display: none !important; } 
        }

        /* --- COMPONENTS --- */
        .section {
            background-color: var(--bg-color); border: 1px solid var(--highlight);
            border-radius: 4px; padding: 10px; position: relative;
        }
        .section-title {
            position: absolute; top: -10px; left: 10px;
            background-color: var(--bg-color); padding: 0 5px; font-size: 12px; font-weight: bold;
        }
        button, select {
            background-color: var(--btn-bg); color: var(--text-color);
            border: 1px solid var(--highlight); padding: 8px 12px;
            border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.1s;
        }
        button:hover, select:hover { background-color: var(--btn-hover); }
        button:active { background-color: var(--highlight); }

        .palette-btn { display: flex; justify-content: center; align-items: center; padding: 4px; min-height: 40px; }
        .palette-btn img { height: 26px; max-width: 100%; object-fit: contain; }

        /* --- GRIDS --- */
        .attack-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .dir-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 150px; margin: 0 auto; }
        .macro-container { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; align-items: center; }
        .macro-row { display: flex; gap: 5px; justify-content: center; }
        .macro-row button { width: 60px; padding: 8px 0; text-align: center; }

        /* --- COMBO MANAGER --- */
        .toolbar { display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--panel-bg); margin-bottom: 10px; flex-shrink: 0; }
        .toolbar-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .list-name-input { background-color: var(--panel-bg); color: var(--text-color); border: 1px solid var(--highlight); padding: 6px 10px; border-radius: 4px; font-weight: bold; width: 180px; flex-shrink: 1; }
        .slot-count-input { background-color: var(--panel-bg); color: var(--text-color); border: 1px solid var(--highlight); padding: 4px 6px; border-radius: 4px; font-weight: bold; width: 55px; text-align: center; }

        .combo-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
        .combo-row-wrapper { transition: all 0.2s ease; }
        .combo-row-child { margin-left: 30px; border-left: 2px solid var(--highlight); padding-left: 10px; }
        .combo-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .combo-name { width: 110px; background-color: var(--panel-bg); color: var(--text-color); border: 1px solid var(--highlight); padding: 6px; border-radius: 4px; flex-shrink: 0; }
        
        .canvas-container {
            flex: 1; min-width: 0; background-color: var(--panel-bg); border: 1px inset var(--highlight);
            border-radius: 4px; min-height: 56px; padding: 5px 10px; overflow-x: auto; overflow-y: hidden; cursor: pointer;
        }

        .token-display { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
        .token-row { display: flex; align-items: center; gap: 6px; width: max-content; }
        .token-img { height: 32px; width: auto; object-fit: contain; vertical-align: middle; }
        .hold-badge { background-color: #FF4444; color: white; font-size: 10px; padding: 2px 4px; border-radius: 4px; margin-right: -4px; z-index: 1; font-weight: bold; }
        .cursor-active { border: 2px solid #fff; box-shadow: 0 0 5px #fff; }
    </style>
</head>
<body>

    <div class="left-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <h2 style="margin: 0;" data-i18n="paletteTitle">PALETTE</h2>
            <button onclick="toggleLang()" id="langBtn" style="padding: 4px 8px; font-size: 12px; border-color: #888;">日本語</button>
        </div>

        <div class="section">
            <div class="section-title" data-i18n="modifiers">Modifiers</div>
            <div style="display: flex; gap: 10px; margin-bottom: 5px;">
                <label><input type="checkbox" id="modHold"> <span data-i18n="nextHold">Next is [Hold]</span></label>
                <label><input type="checkbox" id="modCharge"> <span data-i18n="nextCharge">Next is [Charge]</span></label>
            </div>
        </div>

        <div class="section">
            <div class="section-title" data-i18n="attacks">Attacks & Chains</div>
            <div class="attack-grid">
                <button class="palette-btn" onclick="addToken('lp')" data-token="lp">LP</button>
                <button class="palette-btn" onclick="addToken('mp')" data-token="mp">MP</button>
                <button class="palette-btn" onclick="addToken('hp')" data-token="hp">HP</button>
                <button class="palette-btn" onclick="addToken('any_p')" data-token="any_p">Any P</button>
                <button class="palette-btn" onclick="handlePlus()" data-token="plus">+</button>
                <button class="palette-btn" onclick="addToken('lk')" data-token="lk">LK</button>
                <button class="palette-btn" onclick="addToken('mk')" data-token="mk">MK</button>
                <button class="palette-btn" onclick="addToken('hk')" data-token="hk">HK</button>
                <button class="palette-btn" onclick="addToken('any_k')" data-token="any_k">Any K</button>
                <button class="palette-btn" onclick="addToken('newline')" data-token="newline">↵</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title" data-i18n="directions">Directions</div>
            <div class="dir-grid">
                <button class="palette-btn" onclick="addToken('upleft')" data-token="upleft">↖</button>
                <button class="palette-btn" onclick="addToken('up')" data-token="up">↑</button>
                <button class="palette-btn" onclick="addToken('upright')" data-token="upright">↗</button>
                <button class="palette-btn" onclick="addToken('left')" data-token="left">←</button>
                <div style="visibility: hidden;"></div>
                <button class="palette-btn" onclick="addToken('right')" data-token="right">→</button>
                <button class="palette-btn" onclick="addToken('downleft')" data-token="downleft">↙</button>
                <button class="palette-btn" onclick="addToken('down')" data-token="down">↓</button>
                <button class="palette-btn" onclick="addToken('downright')" data-token="downright">↘</button>
            </div>
            
            <div class="macro-container">
                <div class="macro-row">
                    <button class="palette-btn" onclick="addToken('qcb')" data-token="qcb">QCB</button>
                    <button class="palette-btn" onclick="addToken('qcf')" data-token="qcf">QCF</button>
                </div>
                <div class="macro-row">
                    <button class="palette-btn" onclick="addToken('hcb')" data-token="hcb">HCB</button>
                    <button class="palette-btn" onclick="addToken('hcf')" data-token="hcf">HCF</button>
                    <button class="palette-btn" onclick="addToken('360')" data-token="360">360</button>
                </div>
                <div class="macro-row">
                    <button class="palette-btn" onclick="addToken('rdp')" data-token="rdp">RDP</button>
                    <button class="palette-btn" onclick="addToken('dp')" data-token="dp">DP</button>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title" data-i18n="macros">Macro Shortcuts</div>
            <div style="display: flex; gap: 5px; justify-content: center; margin-top: 10px;">
                <button onclick="applyShortcut('DRC')" style="flex: 1;" data-i18n="driveRush">Drive Rush</button>
                <button onclick="applyShortcut('PDR')" style="flex: 1;" data-i18n="parryDrc">Parry DRC</button>
            </div>
        </div>

        <div class="section" style="margin-bottom: 20px;">
            <div class="section-title" data-i18n="controls">Controls</div>
            <button onclick="backspace()" style="width: 100%; margin-bottom: 5px;" data-i18n="backspace">⌫ Backspace</button>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <button onclick="clearActiveSlot()" style="flex: 1;" data-i18n="clearSlot">Clear Slot</button>
                <button onclick="clearAll()" style="flex: 1;" data-i18n="clearAll">Clear All</button>
            </div>
            <button onclick="pinAll()" style="width: 100%; border: 2px solid #FFF; background-color: #333; padding: 10px;" data-i18n="pinAllBtn">
                📌 Pin All Combos
            </button>
        </div>
    </div>

    <div class="right-panel">
        <div class="toolbar">
            <div class="toolbar-row">
                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                    <strong data-i18n="managerTitle">MANAGER</strong>
                    <input type="text" id="listNameInput" class="list-name-input" placeholder="List Name..." data-i18n-placeholder="listPlaceholder">
                </div>
                <div style="display: flex; gap: 5px;">
                    <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="loadLocalCombos(event)">
                    <button onclick="document.getElementById('fileInput').click()" data-i18n="loadAll">Load Local</button>
                    <button onclick="saveCombos()" data-i18n="saveAll">Save File</button>
                </div>
            </div>
            <div class="toolbar-row" style="justify-content: flex-start;">
                <span data-i18n="comboCount" style="font-weight: bold; font-size: 14px;">Combos:</span>
                <input type="number" id="slotCountInput" class="slot-count-input" value="15" min="1" max="250">
                <button onclick="applySlotCount()" data-i18n="updateBtn">Update</button>
            </div>
        </div>

        <div class="combo-list" id="comboList">
            </div>
    </div>

    <script>
        // --- GOOGLE DRIVE IMAGE MAPPING ---
        const IMAGE_MAP = {
            '360': '1qo3sIst3RjHmDpYoswAVAH_lAkHp7-Hq',
            'any_k': '1iNLpPpDcfYpSUoLhsDr1c2z4BSTF3paB',
            'any_p': '14ia3DmH_h53nOSdCoWMlOthX86aed5wz',
            'c_down': '1CXMOniPYeUWV2nfzrxDg_t46pa_aUFuV',
            'c_downleft': '1_xD5ddsS4fsfEoHpJ6lIQ84k5i3v36ov',
            'c_downright': '12WvzUPSkSmsSS2hKW4Ek_SJlQXe1knpR',
            'c_left': '1i9YCT0PrVEPdZ7LfE6dRY0XBunPcW75Y',
            'c_right': '1Uf_AUr0J8dD3mqeNeEc26eNRcGtBvtYc',
            'c_up': '1bF7MFYEXtE3rB-NRe4bVmsepfQmGW60L',
            'c_upleft': '1PEbU5Tviu4azj0VFkLginz4kOxNCeL6O',
            'c_upright': '1T3nj_rx2s9wOj6_uBmJ6vNnrR0absRE4',
            'down': '1atXz681EX6-1zrw4pyzN8dws-i0dDr7l',
            'downleft': '1WRAbYyERCAuTbGpT_ZB5pXwRvUHq7ykd',
            'downright': '1sp716VqmN1mv2Lxff_3EwIv8MeJkbGP2',
            'dp': '1q3nEZXS3-18VNyglI_EPnQWwj5bNnT9b',
            'goes_into': '1Ip-VMZk6j7_j8giApQg9k05vK81hpC8U',
            'hcb': '1OKUffX1-eFYOOrS_fPl0q3wd4Cmx4WB8',
            'hcf': '1IPdYQ8YKNVmnHSmn2y5vCG4wVBUx3WID',
            'hk': '10IWcl0Jp25ESG4ALMC1713UaQV6no-rx',
            'hp': '1U3-tHJUAjSkaPc5J2oEn8aLS2bTbCwoX',
            'left': '1BMsWGvlOv-IVI0KdImZ4H0lS9ZGqBOXE',
            'lk': '14K2SC_-HRY3EGyixSJjjv0eMH7tCcOCh',
            'lp': '1gdRPLQbTJC3_dZ_NGqUbd74BvKYy2YZW',
            'mk': '17-mKimid-8K0CD8jJv6TTua0rBgYDiTm',
            'mp': '14D-2Qnq8t79wUcqt7YoGeAUPagwuRp_F',
            'newline': '14-xrYu6sXAWScgmQPhT3R7olpXAk1CyH',
            'plus': '1m7G9EVs-a4V1m0HzKvTzpr0faQSFZIVU',
            'qcb': '1XbLfGTAlxpeV40j0FdfuFRMzb-Dy2RWm',
            'qcf': '1Yg0nBlblOJVrFyMWW2hmrTIJUqB51Kil',
            'rdp': '16dhzu77dU3T23QRng3CWrM8EzMFmM-EU',
            'right': '10yiTgnL2xNpd5XIxJUiXgit72u02DX0d',
            'up': '1pmzWEpJBFj_oijA0EQHwb8W8Xf2xXauB',
            'upleft': '1JaNF7WTCcjEozF1xeHLfd4vtK-UfWuZK',
            'upright': '1HmQ5qxbKIBrD7e7SkW_d7R_B4z5oJhG-'
        };

        const ATTACKS = ['lp', 'mp', 'hp', 'lk', 'mk', 'hk', 'any_p', 'any_k', 'h_lp', 'h_mp', 'h_hp', 'h_lk', 'h_mk', 'h_hk', 'h_any_p', 'h_any_k'];
        const DIRECTIONS = ['up', 'down', 'left', 'right', 'upright', 'upleft', 'downright', 'downleft', 'qcb', 'qcf', 'hcb', 'hcf', '360', 'dp', 'rdp', 'c_up', 'c_down', 'c_left', 'c_right', 'c_upright', 'c_upleft', 'c_downright', 'c_downleft'];

        function getDriveUrl(token) {
            let key = token.toLowerCase();
            let id = null;
            if (IMAGE_MAP[key]) id = IMAGE_MAP[key];
            else if (key.startsWith('h_') && IMAGE_MAP[key.substring(2)]) id = IMAGE_MAP[key.substring(2)];
            if (id) return `https://drive.google.com/thumbnail?id=${id}&sz=w128`;
            return null;
        }

        // --- TRANSLATION / i18n SYSTEM ---
        const i18n = {
            en: {
                paletteTitle: "PALETTE", modifiers: "Modifiers", nextHold: "Next is [Hold]", nextCharge: "Next is [Charge]",
                attacks: "Attacks & Chains", directions: "Directions", macros: "Macro Shortcuts",
                driveRush: "Drive Rush", parryDrc: "Parry DRC", controls: "Controls",
                backspace: "⌫ Backspace", clearSlot: "Clear Slot", clearAll: "Clear All", pinAllBtn: "📌 Pin All Combos",
                managerTitle: "MANAGER", listPlaceholder: "List Name...", loadAll: "Load Local", saveAll: "Save File",
                comboCount: "Combos:", updateBtn: "Update", comboPrefix: "Combo", pinBtn: "Pin",
                msgClearConfirm: "Clear all combo slots?", msgEmptyCombo: "Combo is empty!", msgAllEmpty: "All combo slots are empty!",
                msgJsonError: "Failed to parse JSON file.", msgLimit: "Maximum combo slots limited to 250 for performance.",
                defaultListName: "My Combo List", tabTitlePinnedAll: "Pinned: All Combos"
            },
            ja: {
                paletteTitle: "パレット", modifiers: "モディファイア", nextHold: "次は [ホールド]", nextCharge: "次は [タメ]",
                attacks: "攻撃＆チェーン", directions: "方向", macros: "マクロ設定",
                driveRush: "ドライブラッシュ", parryDrc: "パリー DRC", controls: "操作",
                backspace: "⌫ バックスペース", clearSlot: "スロットクリア", clearAll: "すべてクリア", pinAllBtn: "📌 すべてピン留め",
                managerTitle: "マネージャー", listPlaceholder: "リスト名...", loadAll: "ローカル読込", saveAll: "ファイル保存",
                comboCount: "コンボ数:", updateBtn: "更新", comboPrefix: "コンボ", pinBtn: "ピン留め",
                msgClearConfirm: "すべてのコンボをクリアしますか？", msgEmptyCombo: "コンボが空です！", msgAllEmpty: "すべてのコンボが空です！",
                msgJsonError: "JSONファイルの読み込みに失敗しました。", msgLimit: "パフォーマンス維持のため、最大スロット数は250に制限されています。",
                defaultListName: "マイコンボリスト", tabTitlePinnedAll: "ピン留め: すべて"
            }
        };

        function t(key) { return i18n[appState.lang][key] || key; }

        function toggleLang() {
            appState.lang = appState.lang === 'en' ? 'ja' : 'en';
            applyLanguage();
        }

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = t(el.getAttribute('data-i18n')));
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.getAttribute('data-i18n-placeholder')));
            document.getElementById('langBtn').innerText = appState.lang === 'en' ? '日本語' : 'English';

            const listInput = document.getElementById('listNameInput');
            if (listInput.value === i18n.en.defaultListName || listInput.value === i18n.ja.defaultListName || listInput.value === "") {
                listInput.value = t('defaultListName');
            }
            appState.slots.forEach((slot, i) => {
                const num = i + 1;
                if (slot.name === `Combo ${num}` || slot.name === `コンボ ${num}`) slot.name = `${t('comboPrefix')} ${num}`;
            });
            init(); 
        }

        // --- STATE ---
        let appState = {
            lang: 'en', activeSlot: 0,
            slots: Array.from({ length: 15 }, (_, i) => ({ name: `Combo ${i + 1}`, tokens: [] }))
        };

        // --- INITIALIZATION ---
        function init() {
            const list = document.getElementById('comboList');
            list.innerHTML = '';
            
            appState.slots.forEach((slot, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'combo-row-wrapper';
                wrapper.id = `wrapper-${i}`;
                wrapper.innerHTML = `
                    <div class="combo-row">
                        <input type="radio" name="activeSlot" ${i === appState.activeSlot ? 'checked' : ''} onchange="setActive(${i})">
                        <span>${i + 1}</span>
                        <input type="text" class="combo-name" value="${slot.name}" oninput="updateName(${i}, this.value)">
                        <div class="canvas-container ${i === appState.activeSlot ? 'cursor-active' : ''}" id="canvas-${i}" onclick="setActive(${i})">
                            <div class="token-display" id="display-${i}"></div>
                        </div>
                        <button class="pin-btn" onclick="pinCombo(${i})">${t('pinBtn')}</button>
                    </div>
                `;
                list.appendChild(wrapper);
                renderTokens(i);
            });
            applyTreeStyles();
            
            if (!window.paletteInitialized) {
                initPalette();
                window.paletteInitialized = true;
            }
        }

        function initPalette() {
            document.querySelectorAll('button[data-token]').forEach(btn => {
                const token = btn.getAttribute('data-token');
                const url = getDriveUrl(token);
                if (url) btn.innerHTML = `<img src="${url}" alt="${token}">`;
            });
        }

        // --- LOGIC ---
        function setActive(index) {
            document.getElementById(`canvas-${appState.activeSlot}`).classList.remove('cursor-active');
            appState.activeSlot = index;
            document.querySelector(`input[name="activeSlot"]:nth-child(${index + 1})`).checked = true;
            document.getElementById(`canvas-${index}`).classList.add('cursor-active');
        }

        function updateName(index, val) {
            appState.slots[index].name = val;
            applyTreeStyles();
        }

        function applySlotCount() {
            let count = parseInt(document.getElementById('slotCountInput').value, 10);
            if (isNaN(count) || count < 1) count = 1;
            if (count > 250) {
                count = 250;
                document.getElementById('slotCountInput').value = 250;
                alert(t('msgLimit'));
            }

            const current = appState.slots.length;
            if (count > current) {
                for (let i = current; i < count; i++) {
                    appState.slots.push({ name: `${t('comboPrefix')} ${i + 1}`, tokens: [] });
                }
            } else if (count < current) {
                appState.slots = appState.slots.slice(0, count);
                if (appState.activeSlot >= count) appState.activeSlot = Math.max(0, count - 1);
            }
            init();
        }

        function applyTreeStyles() {
            appState.slots.forEach((slot, i) => {
                const wrapper = document.getElementById(`wrapper-${i}`);
                if (wrapper) {
                    if (slot.name.trim().startsWith('[>]')) wrapper.classList.add('combo-row-child');
                    else wrapper.classList.remove('combo-row-child');
                }
            });
        }

        function applyModifiers(token) {
            const modHold = document.getElementById('modHold');
            const modCharge = document.getElementById('modCharge');
            let finalToken = token;
            if (modHold.checked && ATTACKS.includes(token)) {
                finalToken = `h_${token}`; modHold.checked = false;
            } else if (modCharge.checked && DIRECTIONS.includes(token)) {
                finalToken = `c_${token}`; modCharge.checked = false;
            }
            return finalToken;
        }

        function addToken(rawToken) {
            const token = applyModifiers(rawToken);
            let combo = appState.slots[appState.activeSlot].tokens;
            if (token === 'newline') {
                combo.push('newline');
            } else if (combo.length > 0) {
                let prev = combo[combo.length - 1];
                if (DIRECTIONS.includes(token)) {
                    if (ATTACKS.includes(prev)) combo.push('goes_into');
                } else if (ATTACKS.includes(token)) {
                    if (DIRECTIONS.includes(prev)) {
                        combo.push('plus');
                    } else if (ATTACKS.includes(prev)) {
                        let addGoesInto = true;
                        const isAnyPk = ['any_p', 'any_k', 'h_any_p', 'h_any_k'].includes(token);
                        if (isAnyPk && prev === token) {
                            let count = 0;
                            for (let i = combo.length - 1; i >= 0; i--) {
                                if (combo[i] === token) count++;
                                else break;
                            }
                            if (count < 3) addGoesInto = false;
                        }
                        if (addGoesInto) combo.push('goes_into');
                    }
                }
                combo.push(token);
            } else {
                combo.push(token);
            }
            renderTokens(appState.activeSlot);
        }

        function handlePlus() {
            let combo = appState.slots[appState.activeSlot].tokens;
            if (combo.length > 0) {
                let prev = combo[combo.length - 1];
                if (prev === 'goes_into') combo[combo.length - 1] = 'plus';
                else if (prev === 'plus') combo[combo.length - 1] = 'goes_into';
                else combo.push('plus');
            } else {
                combo.push('plus');
            }
            renderTokens(appState.activeSlot);
        }

        function applyShortcut(code) {
            let inserts = [];
            if (code === 'DRC') inserts = ['mp', 'plus', 'mk'];
            if (code === 'PDR') inserts = ['mp', 'plus', 'mk', 'plus', 'right', 'right']; 
            
            let combo = appState.slots[appState.activeSlot].tokens;
            if (combo.length > 0 && inserts.length > 0) {
                let prev = combo[combo.length - 1];
                let first = inserts[0];
                if (DIRECTIONS.includes(first)) {
                    if (ATTACKS.includes(prev)) combo.push('goes_into');
                } else if (ATTACKS.includes(first)) {
                    if (DIRECTIONS.includes(prev)) combo.push('plus');
                    else if (ATTACKS.includes(prev)) combo.push('goes_into');
                }
            }
            inserts.forEach(t => combo.push(t));
            renderTokens(appState.activeSlot);
        }

        function backspace() {
            let combo = appState.slots[appState.activeSlot].tokens;
            if (combo.length > 0) {
                combo.pop();
                if (combo.length > 0 && (combo[combo.length - 1] === 'goes_into' || combo[combo.length - 1] === 'plus')) {
                    combo.pop(); 
                }
                renderTokens(appState.activeSlot);
            }
        }

        function clearActiveSlot() {
            appState.slots[appState.activeSlot].tokens = [];
            renderTokens(appState.activeSlot);
        }

        function clearAll() {
            if(confirm(t('msgClearConfirm'))) {
                appState.slots.forEach(slot => slot.tokens = []);
                appState.slots.forEach((_, i) => renderTokens(i));
            }
        }

        // --- RENDERING ---
        function renderTokens(index) {
            const display = document.getElementById(`display-${index}`);
            const container = document.getElementById(`canvas-${index}`);
            const tokens = appState.slots[index].tokens;
            
            let html = '<div class="token-row">'; 
            
            tokens.forEach(t => {
                if (t === 'newline') {
                    html += '</div><div class="token-row">';
                    return; 
                }

                const url = getDriveUrl(t);
                const isHold = t.toLowerCase().startsWith('h_');

                if (url) {
                    if (isHold && !IMAGE_MAP[t.toLowerCase()]) {
                        html += `<span class="hold-badge">[H]</span><img src="${url}" class="token-img" title="${t}">`;
                    } else {
                        html += `<img src="${url}" class="token-img" title="${t}">`;
                    }
                } else {
                    if (t === 'goes_into') html += `<span style="font-weight:bold;">➔</span>`;
                    else if (t === 'plus') html += `<span style="font-weight:bold;">+</span>`;
                    else {
                        const bg = ATTACKS.includes(t) ? 'var(--highlight)' : 'var(--btn-bg)';
                        html += `<span class="token-pill" style="background-color: ${bg}">${t}</span>`;
                    }
                }
            });
            html += '</div>'; 
            display.innerHTML = html;
            container.scrollLeft = container.scrollWidth; 
        }

        // --- PIN FEATURES ---
        function buildTokensHtml(tokens) {
            let html = '<div class="token-row" style="display:flex; align-items:center; gap:8px; width:max-content;">'; 
            tokens.forEach(t => {
                if (t === 'newline') {
                    html += '</div><div class="token-row" style="display:flex; align-items:center; gap:8px; width:max-content; margin-top:8px;">';
                    return;
                }
                const url = getDriveUrl(t);
                const isHold = t.toLowerCase().startsWith('h_');
                if (url) {
                    let imgHtml = `<img src="${url}" style="height: 48px; width: auto; object-fit: contain; vertical-align: middle;">`;
                    if (isHold && !IMAGE_MAP[t.toLowerCase()]) {
                        html += `<span style="background: #FF4444; color: white; font-size: 14px; padding: 2px 6px; border-radius: 4px; margin-right: -4px; z-index: 1; font-weight: bold;">[H]</span>${imgHtml}`;
                    } else html += imgHtml;
                } else {
                    if(t === 'goes_into') html += `<span style="font-weight:bold; font-size: 28px;">➔</span>`;
                    else if(t === 'plus') html += `<span style="font-weight:bold; font-size: 28px;">+</span>`;
                    else {
                        const bg = ATTACKS.includes(t) ? '#505050' : '#2A2A2A';
                        html += `<span style="background-color: ${bg}; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 24px;">${t}</span>`;
                    }
                }
            });
            html += '</div>'; 
            return html;
        }

        function pinCombo(index) {
            const slot = appState.slots[index];
            if (slot.tokens.length === 0) return alert(t('msgEmptyCombo'));
            const isChild = slot.name.trim().startsWith('[>]');
            const displayName = isChild ? slot.name.trim().substring(3).trim() : slot.name.trim();

            const pinHtml = `
                <!DOCTYPE html><html><head><title>Pinned: ${displayName}</title>
                <style>body { background-color: #111; color: #fff; font-family: Arial, sans-serif; padding: 20px; margin: 0; }
                h3 { color: #888; margin: 0 0 15px 0; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
                .scroll-wrapper { overflow-x: auto; padding-bottom: 15px; }</style></head>
                <body><h3>${displayName}</h3><div class="scroll-wrapper">${buildTokensHtml(slot.tokens)}</div></body></html>`;

            const win = window.open('', '_blank', 'width=800,height=200,menubar=no,toolbar=no,location=no');
            win.document.write(pinHtml); win.document.close();
        }

        function pinAll() {
            const populatedSlots = appState.slots.filter(s => s.tokens.length > 0);
            if (populatedSlots.length === 0) return alert(t('msgAllEmpty'));
            const listName = document.getElementById('listNameInput').value;

            const allCombosHtml = populatedSlots.map(slot => {
                const isChild = slot.name.trim().startsWith('[>]');
                const displayName = isChild ? slot.name.trim().substring(3).trim() : slot.name.trim();
                const wrapperStyle = isChild ? 'margin-left: 40px; border-left: 2px solid #505050; padding-left: 15px;' : 'margin-top: 20px;';
                return `<div style="margin-bottom: 20px; ${wrapperStyle}"><h3 style="margin-top:0;">${displayName}</h3><div class="scroll-wrapper">${buildTokensHtml(slot.tokens)}</div></div>`;
            }).join('');

            const pinHtml = `
                <!DOCTYPE html><html><head><title>${t('tabTitlePinnedAll')}</title>
                <style>body { background-color: #111; color: #fff; font-family: Arial, sans-serif; padding: 20px; margin: 0; }
                h2 { color: #fff; margin: 0 0 20px 0; font-size: 24px; border-bottom: 1px solid #333; padding-bottom: 10px;}
                h3 { color: #888; margin: 0 0 10px 0; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
                .scroll-wrapper { overflow-x: auto; padding-bottom: 15px; }</style></head>
                <body><h2>${listName}</h2>${allCombosHtml}</body></html>`;

            const win = window.open('', '_blank', 'width=800,height=600,menubar=no,toolbar=no,location=no');
            win.document.write(pinHtml); win.document.close();
        }

        // --- SAVE/LOAD JSON ---
        function saveCombos() {
            const listName = document.getElementById('listNameInput').value;
            const exportData = { glyph: "Default", list_name: listName, slot_count: appState.slots.length, slots: appState.slots };
            const safeFileName = listName.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'combo_list';
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 4));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr); dlAnchorElem.setAttribute("download", `${safeFileName}.json`);
            dlAnchorElem.click();
        }

        function loadLocalCombos(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loadedData = JSON.parse(e.target.result);
                    let fallbackName = file.name.replace('.json', '');
                    processLoadedJson(loadedData, fallbackName);
                } catch(err) { alert(t('msgJsonError')); }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        function processLoadedJson(loadedData, fallbackName) {
            let newSlots = [];
            
            if (loadedData.list_name) document.getElementById('listNameInput').value = loadedData.list_name;
            else document.getElementById('listNameInput').value = fallbackName;

            if (loadedData.slots && Array.isArray(loadedData.slots)) {
                newSlots = loadedData.slots; 
            } else if (loadedData.name && Array.isArray(loadedData.tokens)) {
                appState.slots[appState.activeSlot].name = loadedData.name;
                appState.slots[appState.activeSlot].tokens = loadedData.tokens;
                init(); return;
            }

            if (newSlots.length > 0) {
                let slotCount = loadedData.slot_count || newSlots.length;
                if (slotCount > 250) { slotCount = 250; alert(t('msgLimit')); }
                
                document.getElementById('slotCountInput').value = slotCount;
                appState.slots = newSlots.slice(0, slotCount);
                
                while(appState.slots.length < slotCount) {
                    appState.slots.push({name: `${t('comboPrefix')} ${appState.slots.length+1}`, tokens: []});
                }
                appState.activeSlot = 0;
                init();
            }
        }

        window.onload = () => applyLanguage(); 
    </script>
</body>
